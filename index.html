<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>UNH HelpDesk 2026 - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: radial-gradient(circle at center, #1a2a6c, #0a0e1a); height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Inter', sans-serif; color: white; overflow: hidden; }
        .login-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); padding: 40px; border-radius: 25px; width: 400px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .btn-unh { background: #f5c518; color: #0d1b5e; font-weight: 800; border: none; padding: 12px; transition: 0.3s; }
        .btn-unh:hover { background: #fff; transform: scale(1.02); }
        .form-control { background: rgba(0,0,0,0.4) !important; border: 1px solid rgba(255,255,255,0.2) !important; color: white !important; }
        .form-control:focus { border-color: #f5c518 !important; box-shadow: none; }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <h2 class="fw-bold mb-1">UNH <span style="color:#f5c518">2026</span></h2>
        <p class="text-white-50 small mb-4">SISTEMA DE GESTIÓN TI</p>
        <input type="email" id="email" class="form-control mb-3" placeholder="Correo Institucional">
        <input type="password" id="password" class="form-control mb-4" placeholder="••••••••">
        <button class="btn btn-unh w-100 rounded-pill" onclick="validar()">ENTRAR AL SISTEMA</button>
    </div>
    <script>
        function validar() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const autorizados = ["41925797@continental.edu.pe", "42146038@continental.edu.pe", "48243926@continental.edu.pe", "45385474@continental.edu.pe", "47165799@continental.edu.pe"];
            if (autorizados.includes(email) && pass === "123456") { window.location.href = "maestra.html"; }
            else { alert("Acceso denegado."); }
        }
    </script>
</body>
</html>
